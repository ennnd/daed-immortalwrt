name: Build Newifi3 sing-box firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'newifi3-*'

permissions:
  contents: read

jobs:
  build:
    # 固定 24.04：ubuntu-latest 正在迁移到 Ubuntu 26，迁移后 apt 包名/工具链都可能变，
    # 冒这个风险不值得。
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ binutils patch bzip2 flex bison make \
            autoconf gettext texinfo unzip sharutils libncurses-dev zlib1g-dev \
            gawk git rsync python3 python3-setuptools python3-dev \
            python3-pyelftools wget curl zstd bc libssl-dev libelf-dev \
            swig cpio time

      - name: Clone ImmortalWrt 25.12.2
        run: |
          set -e
          if git clone --depth 1 -b v25.12.2 \
              https://github.com/immortalwrt/immortalwrt.git openwrt; then
            echo "cloned tag v25.12.2"
          else
            rm -rf openwrt
            git clone --depth 1 -b openwrt-25.12 \
              https://github.com/immortalwrt/immortalwrt.git openwrt
            echo "cloned branch openwrt-25.12"
          fi
          cd openwrt
          git log -1 --oneline

      # 先只 update，不 install：install 会按 feeds 里的内容生成 package/feeds/* 软链接，
      # 必须在下面换掉 sing-box 之后再做，链接才会指向 1.14.3。
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Add sing-box 1.14.3 package
        run: |
          set -e
          git clone --depth 1 -b master \
            https://github.com/immortalwrt/packages.git /tmp/imm-packages

          # 必须放回 feed 的原始层级（feeds/packages/net/sing-box）。
          # 该 Makefile 用 `include ../../lang/golang/golang-package.mk` 引入 golang 宏，
          # 这个相对路径只有“三级深度”才成立；放到 package/sing-box 会指向不存在的
          # <topdir>/lang/golang/golang-package.mk，于是 GO_ARCH_DEPENDS 未定义，
          # config 块首行 `depends on $(subst @,,$(GO_ARCH_DEPENDS))` 展开成空的
          # `depends on`，make defconfig 时 Kconfig 直接报 syntax error。
          rm -rf openwrt/package/sing-box
          rm -rf openwrt/feeds/packages/net/sing-box
          cp -a /tmp/imm-packages/net/sing-box openwrt/feeds/packages/net/sing-box

          # 25.12.2 的 feed 没有 libcronet；mips 上 naive outbound 本来也不可用。
          # 保留这个条件依赖只会产生 select PACKAGE_libcronet 的 warning，
          # 顺手去掉少点噪音。
          sed -i \
            -e 's/ +SING_BOX_BUILD_NAIVE_OUTBOUND:libcronet//g' \
            -e 's/ +SING_BOX_TINY_BUILD_NAIVE_OUTBOUND:libcronet//g' \
            openwrt/feeds/packages/net/sing-box/Makefile

          # 自检 1：Makefile 里的相对 include 必须能落到 feed 的 golang 目录
          test -f openwrt/feeds/packages/net/sing-box/../../lang/golang/golang-package.mk
          # 自检 2：GO_ARCH_DEPENDS 必须真的存在（它是 config 块首行的依赖表达式）
          grep -q '^GO_ARCH_DEPENDS:=@(' \
            openwrt/feeds/packages/lang/golang/golang-values.mk
          grep -n 'libcronet' openwrt/feeds/packages/net/sing-box/Makefile || true
          grep -E '^PKG_VERSION|^PKG_HASH' openwrt/feeds/packages/net/sing-box/Makefile

      - name: Install feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds install -a
          # feeds install 生成的链接形如
          #   package/feeds/packages/sing-box -> ../../../feeds/packages/net/sing-box
          ls -l package/feeds/packages/ | grep -i 'sing-box'
          grep -E '^PKG_VERSION' package/feeds/packages/sing-box/Makefile

      # LuCI 面板。必须在 Configure 之前放进 package/，否则 defconfig 扫不到这个包。
      # 该包用 `include $(TOPDIR)/feeds/luci/luci.mk`（luci.mk 在 feed 根目录），
      # 所以依赖 feeds install 之后才存在；顺序不能动。
      - name: Install luci-app-singbox
        run: |
          set -e
          rm -rf openwrt/package/luci-app-singbox
          cp -a package/luci-app-singbox openwrt/package/
          test -f openwrt/package/luci-app-singbox/Makefile
          test -f openwrt/feeds/luci/luci.mk

          # 前端语法（LuCI view 是 AMD 模块，node 只查语法）
          find package/luci-app-singbox/htdocs -name '*.js' | while read f; do
            node --check "$f"
          done

          # 纯逻辑单测：JSONC 剥注释 / base64 / URI 解析 / 订阅三格式 / 合并与 members 修正
          node package/luci-app-singbox/test/run.js

      # 把解析出的节点合并进真实配置模板，用官方 1.14.3 二进制验 schema。
      # 这一步能在编译前挡住"字段写错、1.14 不认"的问题，省一次 75 分钟。
      - name: Validate sample config with sing-box 1.14.3
        run: |
          set -e
          curl -fsSL -o /tmp/sb.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          tar -xzf /tmp/sb.tgz -C /tmp
          mkdir -p /tmp/rs
          curl -fsSL -o /tmp/rs/geosite-cn.srs \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs
          curl -fsSL -o /tmp/rs/geoip-cn.srs \
            https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs
          SINGBOX_SAMPLE=/tmp/sample.json node package/luci-app-singbox/test/run.js
          sed -i 's#/etc/sing-box/rule-set/#/tmp/rs/#g' /tmp/sample.json
          /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c /tmp/sample.json
          echo "sample config OK"

          # 再跑一遍"模拟 LuCI"测试：四个页面 render + 节点/订阅写入链路，
          # 最后把它真实写出的 config.json 也过一遍 check。
          SIM_OUT=/tmp/app-written.json node package/luci-app-singbox/test/sim.js
          sed -i 's#/etc/sing-box/rule-set/#/tmp/rs/#g' /tmp/app-written.json
          /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c /tmp/app-written.json
          echo "UI written config OK"

      - name: Install firmware files
        run: |
          set -e
          mkdir -p openwrt/files
          cp -a newifi3-files/. openwrt/files/

          mkdir -p openwrt/files/etc/sing-box/rule-set
          curl -fL --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs \
            -o openwrt/files/etc/sing-box/rule-set/geosite-cn.srs
          curl -fL --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs \
            -o openwrt/files/etc/sing-box/rule-set/geoip-cn.srs

          chmod +x openwrt/files/usr/bin/singbox-on openwrt/files/usr/bin/singbox-off
          ls -l openwrt/files/etc/sing-box/rule-set/

      - name: Check node placeholders
        run: |
          if grep -q '"YOUR_' newifi3-files/etc/sing-box/config.json; then
            echo "::notice::config.json contains placeholders; sing-box is disabled by default. Fill nodes on the router and run singbox-on."
          fi

      - name: Configure
        run: |
          set -e
          cp configs/newifi3-singbox.config openwrt/.config
          cd openwrt
          make defconfig

          # 目标设备必须是 d-team_newifi-d2。符号写错（例如多设备专用的
          # CONFIG_TARGET_DEVICE_<board>_<sub>_DEVICE_<dev>）时 defconfig 会静默丢弃，
          # 回退到子目标默认设备（ramips/mt7621 是 ADSLR G7），白编译一小时才在
          # "Check image size" 报没有 sysupgrade —— 所以这里先卡死。
          if ! grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y' .config; then
            echo "ERROR: target device d-team_newifi-d2 is not selected" >&2
            grep -E '^CONFIG_TARGET_(ramips|MULTI_PROFILE|PROFILE)' .config || true
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_sing-box=y' .config; then
            sed -i 's/^CONFIG_PACKAGE_sing-box=y/# CONFIG_PACKAGE_sing-box is not set/' .config
            echo 'CONFIG_PACKAGE_sing-box-tiny=y' >> .config
            make defconfig
          fi

          if ! grep -q '^CONFIG_PACKAGE_sing-box-tiny=y' .config; then
            echo "ERROR: sing-box-tiny is not selected" >&2
            grep -E 'CONFIG_PACKAGE_sing-box' .config || true
            exit 1
          fi

          # 同理：luci-app-singbox 的符号如果不可见，defconfig 也会静默丢弃，
          # 编出来就是一个没有面板的固件，白等一小时。
          if ! grep -q '^CONFIG_PACKAGE_luci-app-singbox=y' .config; then
            echo "ERROR: luci-app-singbox is not selected" >&2
            grep -E 'CONFIG_PACKAGE_(luci|luci-lib|luci-app)' .config | head -20 || true
            exit 1
          fi

          grep -E '^CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y|^CONFIG_PACKAGE_sing-box|^CONFIG_PACKAGE_luci-app-singbox|^CONFIG_LUCI_LANG' .config

      - name: Build
        run: |
          cd openwrt
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s

      # 编译完先确认面板真的装进了镜像：包编出来但没进 rootfs 的情况，
      # 只有刷机后才会发现（manifest 是唯一便宜的现场证据）。
      - name: Verify luci-app-singbox in image
        run: |
          set -e
          M=$(ls openwrt/bin/targets/ramips/mt7621/*.manifest 2>/dev/null | head -n1 || true)
          if [ -z "$M" ]; then
            echo "::error::没有生成 manifest"
            exit 1
          fi
          grep -iE 'sing-box|luci-app-singbox|uclient-fetch|ca-bundle' "$M" || true
          if ! grep -q 'luci-app-singbox' "$M"; then
            echo "::error::luci-app-singbox 没有进镜像"
            exit 1
          fi
          if ! grep -q 'luci-i18n-singbox' "$M"; then
            echo "::warning::中文语言包没进镜像（面板仍可用，因为源码里的 msgid 就是中文）"
          fi

      # 先上传再检查：万一大小门限没过，固件也不会跟着一起丢掉（省一次 75 分钟重编）
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-newifi3-singbox
          path: |
            openwrt/bin/targets/ramips/mt7621/*d-team_newifi-d2*sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/*d-team_newifi-d2*.manifest
          if-no-files-found: error

      - name: Check image size
        run: |
          set -e
          OUT=openwrt/bin/targets/ramips/mt7621
          # 实际文件名是 ...-d-team_newifi-d2-squashfs-sysupgrade.bin，
          # 不要把 -squashfs- 写死在通配符里。
          BIN=$(ls "$OUT"/*d-team_newifi-d2*sysupgrade.bin 2>/dev/null | head -n1 || true)
          if [ -z "$BIN" ]; then
            echo "::error::no d-team_newifi-d2 sysupgrade image was produced"
            ls -lh "$OUT" 2>/dev/null || true
            exit 1
          fi
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "image size: $SIZE bytes (limit 33226752 = d-team_newifi-d2 IMAGE_SIZE 32448k)"
          test "$SIZE" -lt 33226752
