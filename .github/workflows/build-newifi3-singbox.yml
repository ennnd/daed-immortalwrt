name: Build Newifi3 sing-box firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'newifi3-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ binutils patch bzip2 flex bison make \
            autoconf gettext texinfo unzip sharutils libncurses-dev zlib1g-dev \
            gawk git rsync python3 python3-setuptools python3-dev \
            python3-pyelftools wget curl zstd bc libssl-dev libelf-dev \
            swig cpio time

      - name: Clone ImmortalWrt 25.12.2
        run: |
          set -e
          if git clone --depth 1 -b v25.12.2 \
              https://github.com/immortalwrt/immortalwrt.git openwrt; then
            echo "cloned tag v25.12.2"
          else
            rm -rf openwrt
            git clone --depth 1 -b openwrt-25.12 \
              https://github.com/immortalwrt/immortalwrt.git openwrt
            echo "cloned branch openwrt-25.12"
          fi
          cd openwrt
          git log -1 --oneline

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add sing-box 1.14.3 package
        run: |
          set -e
          git clone --depth 1 -b master \
            https://github.com/immortalwrt/packages.git /tmp/imm-packages
          rm -rf openwrt/package/sing-box openwrt/feeds/packages/net/sing-box
          cp -a /tmp/imm-packages/net/sing-box openwrt/package/sing-box
          grep -E '^PKG_VERSION|^PKG_HASH' openwrt/package/sing-box/Makefile

      - name: Install firmware files
        run: |
          set -e
          mkdir -p openwrt/files
          cp -a newifi3-files/. openwrt/files/

          mkdir -p openwrt/files/etc/sing-box/rule-set
          curl -fL --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs \
            -o openwrt/files/etc/sing-box/rule-set/geosite-cn.srs
          curl -fL --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs \
            -o openwrt/files/etc/sing-box/rule-set/geoip-cn.srs

          chmod +x openwrt/files/usr/bin/singbox-on openwrt/files/usr/bin/singbox-off
          ls -l openwrt/files/etc/sing-box/rule-set/

      - name: Check node placeholders
        run: |
          if grep -q "YOUR_" newifi3-files/etc/sing-box/config.json; then
            echo "::notice::config.json contains placeholders; sing-box is disabled by default. Fill nodes on the router and run singbox-on."
          fi

      - name: Configure
        run: |
          set -e
          cp configs/newifi3-singbox.config openwrt/.config
          cd openwrt
          make defconfig

          grep -q '^CONFIG_PACKAGE_sing-box-tiny=y' .config
          if grep -q '^CONFIG_PACKAGE_sing-box=y' .config; then
            sed -i 's/^CONFIG_PACKAGE_sing-box=y/# CONFIG_PACKAGE_sing-box is not set/' .config
            echo 'CONFIG_PACKAGE_sing-box-tiny=y' >> .config
            make defconfig
          fi

          grep -E 'CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_d-team_newifi-d2|CONFIG_PACKAGE_sing-box' .config

      - name: Build
        run: |
          cd openwrt
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s

      - name: Check image size
        run: |
          set -e
          BIN=$(ls openwrt/bin/targets/ramips/mt7621/*-sysupgrade.bin | head -n1)
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "image size: $SIZE bytes"
          test "$SIZE" -lt 33226752

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-newifi3-singbox
          path: openwrt/bin/targets/ramips/mt7621/*-sysupgrade.bin
          if-no-files-found: error
