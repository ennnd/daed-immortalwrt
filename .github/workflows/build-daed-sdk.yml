name: build-daed-sdk

# 用 ImmortalWrt 25.12.2 SDK 编译 daed 2.1.1（只编包，不编固件）。
# 触发方式:
#   1) Actions 页面手动 Run workflow
#   2) 推送 v* 标签（会额外把 apk 传到 Release）
#
# 产物: 本次 run 页面底部的 Artifacts -> daed-2.1.1-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ILW_RELEASE: "25.12.2"
  TARGET_DIR: "rockchip/armv8"
  SDK_NAME: "immortalwrt-sdk-25.12.2-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64"
  LLVM_BPF: "llvm-bpf-21.1.6.Linux-x86_64.tar.zst"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk before
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils patch bzip2 flex bison make \
            autoconf gettext texinfo unzip sharutils libncurses-dev zlib1g-dev \
            gawk git rsync python3 python3-setuptools python3-dev python3-pyelftools \
            wget curl zstd bc libssl-dev swig cpio time
          # 某些镜像没有 python3-pyelftools 包，兜底用 pip
          python3 -c 'import elftools' 2>/dev/null || \
            pip3 install --break-system-packages pyelftools
          command -v rsync >/dev/null || sudo apt-get install -y rsync

      - name: Download SDK and llvm-bpf
        run: |
          set -euo pipefail
          BASE="https://downloads.immortalwrt.org/releases/${ILW_RELEASE}/targets/${TARGET_DIR}"
          curl -fL --retry 5 --retry-delay 5 -o sdk.tar.zst "${BASE}/${SDK_NAME}.tar.zst"
          curl -fL --retry 5 --retry-delay 5 -o llvm-bpf.tar.zst "${BASE}/${LLVM_BPF}"
          tar --zstd -xf sdk.tar.zst
          tar --zstd -xf llvm-bpf.tar.zst -C "${SDK_NAME}"

          # 兼容 tarball 顶层目录名不是 llvm-bpf/ 的情况
          if [ ! -d "${SDK_NAME}/llvm-bpf" ]; then
            d=$(find "${SDK_NAME}" -maxdepth 1 -type d -name 'llvm-bpf*' | head -n1)
            [ -n "$d" ] && ln -s "$(basename "$d")" "${SDK_NAME}/llvm-bpf"
          fi
          test -f "${SDK_NAME}/llvm-bpf/.llvm-version"

      - name: Update feeds
        run: |
          cd "${SDK_NAME}"
          ./scripts/feeds update -a
          # 不要用 install -a：会把 perl/uboot 等无关包也装进来，
          # 它们的全局 prereq 检查（rsync、python3-pyelftools）会拖垮构建。
          for p in bpf-headers ca-certificates golang golang1.26 golang-bootstrap; do
            ./scripts/feeds install -f "$p"
          done

      - name: Install daed package
        run: |
          cd "${SDK_NAME}"
          sh "${GITHUB_WORKSPACE}/scripts/install-package.sh" "$PWD"

      - name: Patch SDK config
        run: |
          cd "${SDK_NAME}"
          python3 "${GITHUB_WORKSPACE}/scripts/patch-sdk-config.py" Config-build.in
          echo "---- llvm-bpf ----"
          ls -ld llvm-bpf
          cat llvm-bpf/.llvm-version

      - name: Configure
        run: |
          cd "${SDK_NAME}"
          make defconfig

          # SDK 的默认配置可能带 CONFIG_ALL_*（全选 uboot/perl 等包），
          # 这样 make package/daed/compile 会先对一堆无关包做 host 依赖检查。
          # 关掉它们，让 prereq 只检查 daed 及其依赖。
          sed -i \
            -e 's/^CONFIG_BUILDBOT=y/# CONFIG_BUILDBOT is not set/' \
            -e 's/^CONFIG_ALL=y/# CONFIG_ALL is not set/' \
            -e 's/^CONFIG_ALL_KMODS=y/# CONFIG_ALL_KMODS is not set/' \
            -e 's/^CONFIG_ALL_NONSHARED=y/# CONFIG_ALL_NONSHARED is not set/' \
            -e 's/^CONFIG_TARGET_ALL_PROFILES=y/# CONFIG_TARGET_ALL_PROFILES is not set/' \
            .config

          {
            echo 'CONFIG_PACKAGE_daed=y'
            echo 'CONFIG_PACKAGE_kmod-sched-core=y'
            echo 'CONFIG_PACKAGE_kmod-sched-bpf=y'
            echo 'CONFIG_PACKAGE_kmod-xdp-sockets-diag=y'
            echo 'CONFIG_PACKAGE_kmod-veth=y'
          } >> .config

          make defconfig
          echo "---- check ----"
          grep -E 'CONFIG_(USE_LLVM|HAS_BPF|NEED_BPF|PACKAGE_daed|PACKAGE_kmod-sched|PACKAGE_kmod-veth|PACKAGE_kmod-xdp)' .config
          echo "---- ALL_* should be off ----"
          grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|BUILDBOT)' .config || true

          grep -q '^CONFIG_PACKAGE_daed=y' .config || { echo "ERROR: daed 没有被选中"; exit 1; }
          grep -q '^CONFIG_USE_LLVM_PREBUILT=y' .config || {
            echo "ERROR: 没有选中预编译 LLVM"
            grep -n -A3 'USE_LLVM' Config-build.in || true
            exit 1
          }
          if grep -q '^CONFIG_USE_LLVM_BUILD=y' .config; then
            echo "ERROR: USE_LLVM_BUILD 仍为 y，会从源码编译 LLVM"
            exit 1
          fi
          test -x llvm-bpf/bin/clang || { echo "ERROR: llvm-bpf/bin/clang 不存在"; ls -la llvm-bpf; exit 1; }

      - name: Build daed
        run: |
          cd "${SDK_NAME}"
          set -o pipefail
          # 三个二进制包都来自 package/daed/，所以只有这一个 target
          make -j"$(nproc)" package/daed/compile V=s 2>&1 | tee /tmp/daed-build.log

      - name: Error summary
        if: failure()
        run: |
          echo "===== first errors ====="
          grep -n -m 20 -E 'error:|ERROR:|Error [0-9]|failed|No such file|not found' /tmp/daed-build.log || true
          echo "===== last 150 lines ====="
          tail -n 150 /tmp/daed-build.log || true

      - name: Collect packages
        run: |
          mkdir -p out
          find "${SDK_NAME}/bin/packages" -type f \
            \( -name 'daed-2.1.1*.apk' -o -name 'daed_2.1.1*.ipk' \) \
            -exec cp -v {} out/ \;
          ls -lh out
          test -n "$(ls -A out)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daed-2.1.1-apk
          path: out/*
          if-no-files-found: error

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "daed 2.1.1 for ImmortalWrt 25.12.2 (rockchip/armv8, NanoPi R2S)"
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
